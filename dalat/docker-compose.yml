services:
  # Dev: Gotenberg ở cổng 3001. Trong .env đặt GOTENBERG_URL=http://localhost:3001 và VOUCHER_RENDER_BASE_URL=http://host.docker.internal:3000
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER:-dalat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dalat}
      POSTGRES_DB: ${POSTGRES_DB:-dalat}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dalat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
