# Đặt vào /etc/nginx/sites-available/dalat rồi:  sudo ln -s ../sites-available/dalat /etc/nginx/sites-enabled/
# Đổi server_name. Sau đó: sudo nginx -t && sudo systemctl reload nginx
# Rồi xin HTTPS:           sudo certbot --nginx -d dalat.tenmiencuaban.com
server {
    listen 80;
    server_name dalat.tenmiencuaban.com;

    # Ảnh/video căn được upload thẳng lên R2 nên không cần lớn; chừa dư cho form thường
    client_max_body_size 20m;

    # Chat real-time (Socket.io) — bắt buộc nâng cấp lên WebSocket, nếu thiếu thì chat không chạy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3200;   # trùng WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;   # trùng WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
