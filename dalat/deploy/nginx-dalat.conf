# Đặt vào /etc/nginx/sites-available/dalat rồi bật + xin chứng chỉ: certbot --nginx -d dalat.example.com
server {
    listen 80;
    server_name dalat.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket cho Socket.io (chat real-time)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Đặt ở cấp http {} (hoặc /etc/nginx/conf.d/websocket.conf) nếu chưa có:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
