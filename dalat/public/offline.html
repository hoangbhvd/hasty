<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mất kết nối</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#F4F4F0;color:#000;font-family:system-ui,-apple-system,sans-serif;padding:16px}
    main{max-width:360px;border:1px solid #000;background:#fff;padding:24px;box-shadow:4px 4px 0 #000;border-radius:4px;text-align:center}
    h1{margin:0 0 8px;font-size:20px} p{margin:0 0 16px;color:#4A4A46}
    button{height:44px;padding:0 20px;font-size:16px;font-weight:600;background:#FF90E8;border:1px solid #000;border-radius:4px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Không có kết nối mạng. Dữ liệu booking luôn được lấy mới nhất, nên cần có mạng để xem.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
