# Đặt vào /etc/nginx/sites-available/hmstay rồi: sudo ln -s ../sites-available/hmstay /etc/nginx/sites-enabled/
# Đổi server_name. Sau đó: sudo nginx -t && sudo systemctl reload nginx
# Rồi xin HTTPS:           sudo certbot --nginx -d hmstay.tenmiencuaban.com
server {
    listen 80;
    server_name hmstay.tenmiencuaban.com;

    # Ảnh upload nhiều file mỗi lần
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3100;   # trùng WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
